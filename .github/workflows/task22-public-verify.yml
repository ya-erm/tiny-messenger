name: Verify task 22 production delivery
on:
  push:
    branches: ['build/tm-task-22-reply-emoji-css']
permissions:
  contents: read
jobs:
  verify-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify public production health and tested client bundle
        run: |
          python3 - <<'PY'
          import urllib.request,json,hashlib
          base='https://tm.ya-erm.ru'
          def fetch(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers={'Cache-Control':'no-cache'}),timeout=20) as response:
                  assert response.status==200
                  return response.read()
          assert json.loads(fetch('/api/health?verify=task22'))['ok']
          body=fetch('/tasks-embed?verify=task22').decode()
          assert '/_next/static/chunks/01nmmn-jzu1l5.js' in body, 'Public HTML does not reference the new client'
          actual=hashlib.sha256(fetch('/_next/static/chunks/01nmmn-jzu1l5.js')).hexdigest()
          assert actual=='6daa25cc858ddfb322bccb73cded27120994c938bb1717974e7370633cbe8d0c', 'Public JS differs from tested release'
          print('PUBLIC_POSTDEPLOY_OK: healthy HTTPS, new HTML and exact client bundle verified')
          assert hashlib.sha256(fetch('/sw.js')).hexdigest()=='faaf72eac567136895952efd0a24633773edd322066446ee44c4cfca2eae5a25'
          assert hashlib.sha256(fetch('/notification-state.js')).hexdigest()=='da60bb1bc335b360dd71db81b142eb286cec4e16f1598611c0ed38bfc2b21e17'
          assert '/_next/static/chunks/2s6qpvc08p26h.css' in body, 'Public HTML does not reference new CSS'
          assert hashlib.sha256(fetch('/_next/static/chunks/2s6qpvc08p26h.css')).hexdigest()=='c230ae6c5630d43a86ac3a7b1a4c374efc4140b8f2aa33920ad63e4bc31aaf8c', 'Public CSS differs from tested release'
          print('PUBLIC_CSS_OK: exact stylesheet verified')
          assert '0.5.1' in fetch('/').decode(), 'Public shell version differs'
          PY
