name: Build task 26 single-date-heading release
on:
  push:
    branches: ['build/tm-task-26-single-date-heading']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dbb14ed5a2c9415c96ace95d18196c3ad5cff9dd
          persist-credentials: false
      - name: Read-only public connectivity check
        run: |
          if curl --fail --silent --show-error --max-time 12 https://tm.ya-erm.ru/api/health; then
            echo "PUBLIC_TM_HEALTH=ok"
          else
            echo "PUBLIC_TM_HEALTH=unreachable"
          fi
      - name: Build isolated Linux release
        env:
          RUNTIME_IMAGE: node@sha256:0e5f906573693feaa1e21057ebdcfdb5bd5021f050b2dc7c9deceb629c7da2a8
          BUILD_CPUS: '2'
          BUILD_MEMORY_MB: '4096'
          BUILD_NODE_HEAP_MB: '2048'
        run: bash scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tm-task26-dbb14ed5a2c9
          path: |
            releases/artifacts/dbb14ed5a2c9415c96ace95d18196c3ad5cff9dd/app.tar.gz
            releases/artifacts/dbb14ed5a2c9415c96ace95d18196c3ad5cff9dd/runtime-image
            releases/artifacts/dbb14ed5a2c9415c96ace95d18196c3ad5cff9dd/dependencies-key
            releases/artifacts/dbb14ed5a2c9415c96ace95d18196c3ad5cff9dd/revision
            releases/artifacts/dbb14ed5a2c9415c96ace95d18196c3ad5cff9dd/SHA256SUMS
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
