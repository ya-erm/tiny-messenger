name: Build Tiny Messenger libwebp 1.6.0 codec
on:
  push:
    branches: ['build/tm-task-16-webp-codec-v160']
permissions:
  contents: read
jobs:
  codec:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: emscripten-core/emsdk
          ref: 2514ec738de72cebbba7f4fdba0cf2fabcb779a5
          path: codec-sdk
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: webmproject/libwebp
          ref: 4fa21912338357f89e4fd51cf2368325b59e9bd9
          path: codec-source
          persist-credentials: false
      - name: Install pinned Emscripten
        run: |
          ./codec-sdk/emsdk install 3.1.70
          ./codec-sdk/emsdk activate 3.1.70
      - name: Build isolated single-threaded browser encoder
        run: |
          sudo systemd-run --scope --property=CPUQuota=200% --property=MemoryMax=4G -- bash -c 'source codec-sdk/emsdk_env.sh && bash scripts/build-webp-codec.sh codec-source codec-output'
      - uses: actions/upload-artifact@v4
        with:
          name: tm-libwebp-1.6.0-encoder
          path: codec-output/
          retention-days: 7
