name: Verify task 11 r2 production delivery
on:
  push:
    branches: ['build/tm-task-11-sequential-devices']
permissions:
  contents: read
jobs:
  verify-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify public production health and tested client bundle
        run: |
          python3 - <<'PY'
          import urllib.request,json,hashlib
          base='https://tm.ya-erm.ru'
          def fetch(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers={'Cache-Control':'no-cache'}),timeout=20) as response:
                  assert response.status==200
                  return response.read()
          assert json.loads(fetch('/api/health?verify=task11-r2'))['ok']
          body=fetch('/tasks-embed?verify=task11-r2').decode()
          assert '/_next/static/chunks/1ydlawkk8bvwn.js' in body, 'Public HTML does not reference the new client'
          actual=hashlib.sha256(fetch('/_next/static/chunks/1ydlawkk8bvwn.js')).hexdigest()
          assert actual=='f328b8733b033c879994e2574afdf74a1c9477fc6c4306616db53be4e15d0719', 'Public JS differs from tested release'
          print('PUBLIC_POSTDEPLOY_OK: healthy HTTPS, new HTML and exact client bundle verified')
          assert hashlib.sha256(fetch('/sw.js')).hexdigest()=='faaf72eac567136895952efd0a24633773edd322066446ee44c4cfca2eae5a25'
          assert hashlib.sha256(fetch('/notification-state.js')).hexdigest()=='da60bb1bc335b360dd71db81b142eb286cec4e16f1598611c0ed38bfc2b21e17'
          assert '/_next/static/chunks/0r4adxti_6r6_.css' in body, 'Public HTML does not reference new CSS'
          assert hashlib.sha256(fetch('/_next/static/chunks/0r4adxti_6r6_.css')).hexdigest()=='182d956e2c7ae1cbae54b006849524f8841fd40b0eb8f9a3898cf1ffc13023cc', 'Public CSS differs from tested release'
          print('PUBLIC_CSS_OK: exact stylesheet verified')
          assert '0.4.0' in fetch('/').decode(), 'Public shell version differs'
          PY
