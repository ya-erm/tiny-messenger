name: Verify task 25 paperclip production delivery
on:
  push:
    branches: ['build/tm-task-25-paperclip']
permissions:
  contents: read
jobs:
  verify-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify public production health and tested client bundle
        run: |
          python3 - <<'PY'
          import urllib.request,json,hashlib
          base='https://tm.ya-erm.ru'
          def fetch(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers={'Cache-Control':'no-cache'}),timeout=20) as response:
                  assert response.status==200
                  return response.read()
          assert json.loads(fetch('/api/health?verify=task25'))['ok']
          body=fetch('/tasks-embed?verify=task25').decode()
          assert '/_next/static/chunks/5027-7ec0a18a4c96933b.js' in body, 'Public HTML does not reference the new client'
          actual=hashlib.sha256(fetch('/_next/static/chunks/5027-7ec0a18a4c96933b.js')).hexdigest()
          assert actual=='bc9323c8d89ff35ec0a16b3afbdba30c1b44dd5e1d34e5f6f768628ff131e643', 'Public JS differs from tested release'
          assert b'M20 10 11 19a4.95' in fetch('/_next/static/chunks/5027-7ec0a18a4c96933b.js'), 'Paperclip SVG missing'
          print('PUBLIC_POSTDEPLOY_OK: healthy HTTPS, new HTML and exact client bundle verified')
          assert hashlib.sha256(fetch('/sw.js')).hexdigest()=='f1e381c849bf2fe78d73b4a147cff47af3700aee7dbe319538cb47e9d7e94ad0'
          assert hashlib.sha256(fetch('/notification-state.js')).hexdigest()=='da60bb1bc335b360dd71db81b142eb286cec4e16f1598611c0ed38bfc2b21e17'
          assert hashlib.sha256(fetch('/webp-encoder-worker.js')).hexdigest()=='327cc326fcc5fd838cc67f1953e2b39c681bf72da212898bdbda04ab46b3e106'
          assert hashlib.sha256(fetch('/codecs/libwebp-1.6.0-edcc45730b9d/encoder.mjs')).hexdigest()=='af70bc61b561ad12b41e7216beca412b973e5a370f65b95d207482faa7dffe28'
          assert hashlib.sha256(fetch('/codecs/libwebp-1.6.0-edcc45730b9d/encoder.wasm')).hexdigest()=='b652e5f9fb8681b7057da5089345b0703234c99b82973b9b8c48cc133f8f944e'
          assert '/_next/static/css/da996f0972eeb710.css' in body, 'Public HTML does not reference new CSS'
          assert hashlib.sha256(fetch('/_next/static/css/da996f0972eeb710.css')).hexdigest()=='c0e41c2dfe8e16d82037957ec6ccf46f6249e68d6e4cc82f87b2064ef8eca55e', 'Public CSS differs from tested release'
          print('PUBLIC_CSS_OK: exact stylesheet verified')
          assert '0.7.6' in fetch('/').decode(), 'Public shell version differs'
          with urllib.request.urlopen(base+'/codecs/libwebp-1.6.0-edcc45730b9d/encoder.wasm',timeout=20) as r:
              assert r.headers.get('Content-Type','').startswith('application/wasm')
              assert 'immutable' in r.headers.get('Cache-Control','')
          with urllib.request.urlopen(base+'/codecs/libwebp-1.6.0-edcc45730b9d/encoder.mjs',timeout=20) as r:
              assert 'javascript' in r.headers.get('Content-Type','')
          PY
