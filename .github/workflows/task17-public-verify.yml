name: Verify task 17 production delivery
on:
  push:
    branches: ['build/tm-task-17-personal-notifications']
permissions:
  contents: read
jobs:
  verify-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify public production health and tested client bundle
        run: |
          python3 - <<'PY'
          import urllib.request,json,hashlib
          base='https://tm.ya-erm.ru'
          def fetch(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers={'Cache-Control':'no-cache'}),timeout=20) as response:
                  assert response.status==200
                  return response.read()
          assert json.loads(fetch('/api/health?verify=task17-cf897cd'))['ok']
          body=fetch('/tasks-embed?verify=task17-cf897cd').decode()
          assert '/_next/static/chunks/0g9rjh9lsg8sn.js' in body, 'Public HTML does not reference the new client'
          actual=hashlib.sha256(fetch('/_next/static/chunks/0g9rjh9lsg8sn.js')).hexdigest()
          assert actual=='97baaaac333f687a85ba732913aa67003cdd3c91ffa7b139c7dd1480e4699ff4', 'Public JS differs from tested release'
          print('PUBLIC_POSTDEPLOY_OK: healthy HTTPS, new HTML and exact client bundle verified')
          assert hashlib.sha256(fetch('/sw.js')).hexdigest()=='c59681d47e6824727c7a36132eb62dc2e077cf4318ad4ed9ac854549a6c225da'
          assert hashlib.sha256(fetch('/notification-state.js')).hexdigest()=='e2f7c202abcf36fd998b7a15095a858cc44e80d4cd6fe33a6303ebb33eee7621'
          assert '/_next/static/chunks/0s8xg_hiwrt92.css' in body, 'Public HTML does not reference new CSS'
          assert hashlib.sha256(fetch('/_next/static/chunks/0s8xg_hiwrt92.css')).hexdigest()=='4c2bc23c63c3014e09702f600fd44cc8db9bc63f20326158de547bb54ad34e96', 'Public CSS differs from tested release'
          print('PUBLIC_CSS_OK: exact stylesheet verified')
          PY
