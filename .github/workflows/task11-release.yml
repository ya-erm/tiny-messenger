name: Build task 11 sequential-devices release
on:
  push:
    branches: ['build/tm-task-11-sequential-devices']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ba3c6376dbd6ce76475e0af398a17915af32d7ca
          persist-credentials: false
      - name: Read-only public connectivity check
        run: |
          if curl --fail --silent --show-error --max-time 12 https://tm.ya-erm.ru/api/health; then
            echo "PUBLIC_TM_HEALTH=ok"
          else
            echo "PUBLIC_TM_HEALTH=unreachable"
          fi
      - name: Build isolated Linux release
        env:
          RUNTIME_IMAGE: node@sha256:0e5f906573693feaa1e21057ebdcfdb5bd5021f050b2dc7c9deceb629c7da2a8
          BUILD_CPUS: '2'
          BUILD_MEMORY_MB: '4096'
          BUILD_NODE_HEAP_MB: '2048'
        run: bash scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tm-task11-ba3c6376dbd6
          path: |
            releases/artifacts/ba3c6376dbd6ce76475e0af398a17915af32d7ca/app.tar.gz
            releases/artifacts/ba3c6376dbd6ce76475e0af398a17915af32d7ca/runtime-image
            releases/artifacts/ba3c6376dbd6ce76475e0af398a17915af32d7ca/dependencies-key
            releases/artifacts/ba3c6376dbd6ce76475e0af398a17915af32d7ca/revision
            releases/artifacts/ba3c6376dbd6ce76475e0af398a17915af32d7ca/SHA256SUMS
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
