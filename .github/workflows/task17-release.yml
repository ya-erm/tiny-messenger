name: Build task 17 notification-open-types release
on:
  push:
    branches: ['build/tm-task-17-notification-open-types']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2d3420f6af4760e6bbf32e53d5bbcf036cd02806
          persist-credentials: false
      - name: Read-only public connectivity check
        run: |
          if curl --fail --silent --show-error --max-time 12 https://tm.ya-erm.ru/api/health; then
            echo "PUBLIC_TM_HEALTH=ok"
          else
            echo "PUBLIC_TM_HEALTH=unreachable"
          fi
      - name: Build isolated Linux release
        env:
          RUNTIME_IMAGE: node@sha256:0e5f906573693feaa1e21057ebdcfdb5bd5021f050b2dc7c9deceb629c7da2a8
          BUILD_CPUS: '2'
          BUILD_MEMORY_MB: '4096'
          BUILD_NODE_HEAP_MB: '2048'
        run: bash scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tm-task17-2d3420f6af47
          path: |
            releases/artifacts/2d3420f6af4760e6bbf32e53d5bbcf036cd02806/app.tar.gz
            releases/artifacts/2d3420f6af4760e6bbf32e53d5bbcf036cd02806/runtime-image
            releases/artifacts/2d3420f6af4760e6bbf32e53d5bbcf036cd02806/dependencies-key
            releases/artifacts/2d3420f6af4760e6bbf32e53d5bbcf036cd02806/revision
            releases/artifacts/2d3420f6af4760e6bbf32e53d5bbcf036cd02806/SHA256SUMS
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
