name: Verify task 10 production delivery
on:
  push:
    branches: ['build/tm-task-10-compact-composer-final']
permissions:
  contents: read
jobs:
  verify-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify public production health and tested client bundle
        run: |
          python3 - <<'PY'
          import urllib.request,json,hashlib
          base='https://tm.ya-erm.ru'
          def fetch(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers={'Cache-Control':'no-cache'}),timeout=20) as response:
                  assert response.status==200
                  return response.read()
          assert json.loads(fetch('/api/health?verify=task10-cf897cd'))['ok']
          body=fetch('/tasks-embed?verify=task10-cf897cd').decode()
          assert '/_next/static/chunks/138eu8d897_kc.js' in body, 'Public HTML does not reference the new client'
          actual=hashlib.sha256(fetch('/_next/static/chunks/138eu8d897_kc.js')).hexdigest()
          assert actual=='77ae910eae3a8b9d8af55f0103c65c7033fd1ff8a4e62286ad33f5ce78169b5b', 'Public JS differs from tested release'
          print('PUBLIC_POSTDEPLOY_OK: healthy HTTPS, new HTML and exact client bundle verified')
          PY
