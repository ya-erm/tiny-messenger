name: Build task 6 consistent emoji release
on:
  push:
    branches: ['build/tm-task-6-consistent-emoji']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 77ca065868232b86dfe8cb83a3c4ee2867b0a54d
          persist-credentials: false
      - name: Read-only public connectivity check
        run: |
          if curl --fail --silent --show-error --max-time 12 https://tm.ya-erm.ru/api/health; then
            echo "PUBLIC_TM_HEALTH=ok"
          else
            echo "PUBLIC_TM_HEALTH=unreachable"
          fi
      - name: Build isolated Linux release
        env:
          RUNTIME_IMAGE: node@sha256:0e5f906573693feaa1e21057ebdcfdb5bd5021f050b2dc7c9deceb629c7da2a8
          BUILD_CPUS: '2'
          BUILD_MEMORY_MB: '4096'
          BUILD_NODE_HEAP_MB: '2048'
        run: bash scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tm-task6-77ca06586823
          path: |
            releases/artifacts/77ca065868232b86dfe8cb83a3c4ee2867b0a54d/app.tar.gz
            releases/artifacts/77ca065868232b86dfe8cb83a3c4ee2867b0a54d/runtime-image
            releases/artifacts/77ca065868232b86dfe8cb83a3c4ee2867b0a54d/dependencies-key
            releases/artifacts/77ca065868232b86dfe8cb83a3c4ee2867b0a54d/revision
            releases/artifacts/77ca065868232b86dfe8cb83a3c4ee2867b0a54d/SHA256SUMS
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
