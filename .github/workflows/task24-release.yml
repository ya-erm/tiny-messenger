name: Build task 24 image-card-header release
on:
  push:
    branches: ['build/tm-task-24-image-card-header']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0fb48337899b28ff4e8d27483ac58d2dd55d4f30
          persist-credentials: false
      - name: Read-only public connectivity check
        run: |
          if curl --fail --silent --show-error --max-time 12 https://tm.ya-erm.ru/api/health; then
            echo "PUBLIC_TM_HEALTH=ok"
          else
            echo "PUBLIC_TM_HEALTH=unreachable"
          fi
      - name: Build isolated Linux release
        env:
          RUNTIME_IMAGE: node@sha256:0e5f906573693feaa1e21057ebdcfdb5bd5021f050b2dc7c9deceb629c7da2a8
          BUILD_CPUS: '2'
          BUILD_MEMORY_MB: '4096'
          BUILD_NODE_HEAP_MB: '2048'
        run: bash scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tm-task24-0fb48337899b
          path: |
            releases/artifacts/0fb48337899b28ff4e8d27483ac58d2dd55d4f30/app.tar.gz
            releases/artifacts/0fb48337899b28ff4e8d27483ac58d2dd55d4f30/runtime-image
            releases/artifacts/0fb48337899b28ff4e8d27483ac58d2dd55d4f30/dependencies-key
            releases/artifacts/0fb48337899b28ff4e8d27483ac58d2dd55d4f30/revision
            releases/artifacts/0fb48337899b28ff4e8d27483ac58d2dd55d4f30/SHA256SUMS
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
