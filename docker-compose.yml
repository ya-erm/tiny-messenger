services:
  messenger:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MESSENGER_DATA_FILE: /app/data/store.json
      RATE_LIMIT_PUBLIC: 120
      RATE_LIMIT_AUTH: 480
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
