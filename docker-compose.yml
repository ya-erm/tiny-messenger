services:
  messenger:
    image: ${MESSENGER_RUNTIME_IMAGE:?Install a release first with scripts/install-release.sh}
    platform: linux/amd64
    user: "1001:1001"
    working_dir: /app
    entrypoint: ["sh", "/app/docker-entrypoint.sh"]
    command: ["node", "scripts/server.mjs"]
    init: true
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.75
    stop_grace_period: 20s
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      HOME: /tmp
      NODE_OPTIONS: --max-old-space-size=192
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_URL: file:/app/data/messenger.db
      MESSENGER_REALTIME_FILE: /app/data/realtime.json
      RATE_LIMIT_PUBLIC: 120
      RATE_LIMIT_AUTH: 480
      RATE_LIMIT_MESSAGES_BURST: 6
      RATE_LIMIT_MESSAGES_BURST_WINDOW_SECONDS: 10
      RATE_LIMIT_MESSAGES_PER_MINUTE: 30
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-mailto:admin@example.com}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      RTC_STUN_URLS: "${RTC_STUN_URLS:-stun:stun.l.google.com:19302}"
      RTC_TURN_URLS: ${RTC_TURN_URLS:-}
      RTC_TURN_SECRET: ${RTC_TURN_SECRET:-}
    volumes:
      - ./data:/app/data
      - type: bind
        source: ${MESSENGER_RELEASE_DIR:?Install a release first}
        target: /app
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MESSENGER_DEPENDENCIES_DIR:?Install release dependencies first}
        target: /app/node_modules
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /app/.next/cache:uid=1001,gid=1001,size=32m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Continuous off-site backup of the SQLite database. Runs as the same uid as
  # the app so it can create its shadow directory next to the database file.
  # Exactly one Litestream instance may replicate a given database.
  # Opt-in: set COMPOSE_PROFILES=backup in .env once the bucket is configured.
  litestream:
    image: litestream/litestream:0.5.17
    profiles: ["backup"]
    restart: unless-stopped
    user: "1001:1001"
    command: ["replicate", "-config", "/etc/litestream.yml"]
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
      LITESTREAM_BUCKET: ${LITESTREAM_BUCKET:-}
      LITESTREAM_PATH: ${LITESTREAM_PATH:-messenger}
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT:-https://storage.yandexcloud.net}
      LITESTREAM_REGION: ${LITESTREAM_REGION:-ru-central1}
    volumes:
      - ./data:/app/data
      - ./deploy/litestream.yml:/etc/litestream.yml:ro
    depends_on:
      messenger:
        condition: service_healthy

  turn:
    image: coturn/coturn:4.16.0-r0
    restart: unless-stopped
    network_mode: host
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${RTC_TURN_SECRET:-}
    volumes:
      - ./deploy/turnserver.conf:/etc/coturn/turnserver.conf:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "turnutils_stunclient 127.0.0.1 -p 3478 >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
